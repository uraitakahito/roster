name: pagestore
on:
  push:
    branches: [main]
    paths: [pagestore/**, cli/**, .node-version, .github/workflows/pagestore.yml]
  pull_request:
    paths: [pagestore/**, cli/**, .node-version, .github/workflows/pagestore.yml]
  schedule:
    # 弱点の知らせは commit と関わりなく出るので、週に 1 度も流す（月曜 00:00 UTC）。
    - cron: "0 0 * * 1"
permissions:
  contents: read
defaults:
  run:
    working-directory: pagestore
env:
  # sqlx-cli の版。上げる時は docs-site の開発のページも合わせる。
  SQLX_CLI_VERSION: 0.9.1
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # SQL の検査は commit した .sqlx/ で行う（DB は要らない）。
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: pagestore
          cache-workspaces: pagestore
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: .sqlx/ が SQL と合っているか
        env:
          SQLX_OFFLINE: "false"
          DATABASE_URL: sqlite://${{ runner.temp }}/prepare.db
        run: |
          command -v cargo-sqlx >/dev/null && cargo sqlx --version | grep -qF "$SQLX_CLI_VERSION" \
            || cargo install "sqlx-cli@$SQLX_CLI_VERSION" --no-default-features --features sqlite
          cargo sqlx database create
          cargo sqlx migrate run
          cargo sqlx prepare --check
  image:
    if: github.event_name != 'schedule'
    # 動かす Mac と同じ CPU の種類（arm64）で作る。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t pagestore:ci -f Containerfile .
      - name: 空の image の中で起き、置いて読めて、止めて起こし直しても残るか
        run: |
          up() { for _ in $(seq 1 40); do curl -fsS http://127.0.0.1:8801/healthz && return; sleep 0.5; done; return 1; }
          docker run -d --name pagestore-ci -p 127.0.0.1:8801:8080 -v pagestore-ci-data:/data pagestore:ci
          up
          curl -fsS -X POST --data-binary '<title>CI</title><p>image の中で動く</p>' \
            'http://127.0.0.1:8801/api/pages?project=ci&key=K-1&kind=result&role=tpm' | tee put.json
          grep -q '"n":1' put.json
          # 止める合図（SIGTERM）で、自分から終わるか（PID 1 は受け口が無いと合図を無視する）。
          docker stop pagestore-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' pagestore-ci)" = 0
          docker start pagestore-ci
          up
          curl -fsS http://127.0.0.1:8801/ci/K-1/result-1.html | grep -q 'image の中で動く'
          curl -fsS 'http://127.0.0.1:8801/?q=image' | grep -q 'result-1'
      - if: always()
        run: docker logs pagestore-ci
  cli:
    # cli と本物の pagestore のつなぎ（tpm page put・path・list・import）。口の形のずれをここで見つける。
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: pagestore
          cache-workspaces: pagestore
      - run: cargo build --locked
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: cli
      - name: pagestore を起こし、tpm の命令を本物に向けて流す
        working-directory: cli
        run: |
          PAGESTORE_DB="$RUNNER_TEMP/e2e.db" PAGESTORE_LISTEN=127.0.0.1:8801 ../pagestore/target/debug/pagestore &
          for _ in $(seq 1 40); do curl -fsS http://127.0.0.1:8801/healthz && break; sleep 0.5; done
          # $TPM_E2E_PAGES_URL が無いと、この試験は飛ばされる（ふだんの pnpm test）。ここでは必ず渡す。
          TPM_E2E_PAGES_URL=http://127.0.0.1:8801 pnpm exec vitest run test/pagestore-e2e.test.ts
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: pagestore/Cargo.toml
          command: check advisories
