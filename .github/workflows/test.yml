name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node --test .claude/skills/_shared/
