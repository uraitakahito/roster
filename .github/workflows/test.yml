name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: cli
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run doccheck
      - run: pnpm test
  gen:
    # 生成した client（cli/gen/<repo>-client/）が、取った定義（cli/gen/model/。release の tag と digest は cli/gen/gen.sh が固める）から
    # 作り直した物と同じか。Smithy の CLI は版と digest を固めて取る（JRE を同梱しているので Java は要らない）。生成器は公開から 2 日たった物だけ。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      # client の build は cli/node_modules の tsc と @smithy/* で打つ。
      - run: pnpm install --frozen-lockfile
      # Smithy の CLI の zip（gen.sh が毎回 digest を見る）・公開から 2 日たったと見た依存の印・smithy build が Maven Central から
      # 取る物（~/.m2/repository）を cache に置き、毎回は取りに行かない（下の見張りの試しで何度も流し、429 で落ちたため。#211）。
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/roster-smithy
            ~/.m2/repository
          key: smithy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cli/gen/gen.sh', 'cli/gen/smithy-build.json') }}
      - run: gen/gen.sh --check
      # 見張りが本当に落とすか: 入れた物（生成した TS・build した JS・取った定義）を 1 byte 替えると、--check が、期待した NG の字で落ちる
      # （ほかの訳で落ちた回を「効いた」と数えない）。
      - name: 入れた物を 1 byte 替えると --check が落ちる
        run: |
          for f in gen/castlist-client/dist-cjs/index.js gen/castlist-client/src/index.ts gen/model/castlist/castlist.smithy \
                   gen/pagetray-client/dist-cjs/index.js gen/pagetray-client/src/index.ts gen/model/pagetray/pagetray.smithy; do
            case "$f" in
              *.smithy) want="の物と違う" ;;
              *) want="が定義と合わない" ;;
            esac
            printf ' ' >>"$f"
            if gen/gen.sh --check 2>"$RUNNER_TEMP/check.err"; then
              echo "::error::$f を替えても gen/gen.sh --check が通った"
              exit 1
            fi
            if ! grep -q "^NG: .*$want" "$RUNNER_TEMP/check.err"; then
              echo "::error::$f を替えた時、gen/gen.sh --check は期待した訳（$want）でなく、ほかの訳で落ちた"
              cat "$RUNNER_TEMP/check.err"
              exit 1
            fi
            git checkout -- "$f"
          done
