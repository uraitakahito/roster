name: pagetray-e2e
# cli と本物の置き場のサーバー（別の repo の pagetray）のつなぎ。API の形のずれをここで見つける。
# サーバーの試験・image の確かめ・弱点の見張りは、pagetray の repo の CI が流す。
on:
  push:
    branches: [main]
    paths: [cli/**, .node-version, .pagetray-version, .github/workflows/pagetray-e2e.yml]
  pull_request:
    paths: [cli/**, .node-version, .pagetray-version, .github/workflows/pagetray-e2e.yml]
permissions:
  contents: read
jobs:
  cli:
    # roster page put・path・list・import・delete を、.pagetray-version の版の pagetray に向けて流す。
    # roster file put・path・list・delete は、置き場に file のエンドポイントがある版（0.4.0 から）でだけ流れる（無い版では試験が飛ばす）。
    # pagetray の image は arm64 だけ（roster を動かす Apple silicon の機械と同じ）なので、arm64 の runner で流す。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: .pagetray-version の版の image を、digest で取って起こす
        run: |
          pinned=$(cat .pagetray-version)            # v<版>@sha256:<digest>
          version=${pinned%%@*}
          digest=${pinned#*@}
          # login しない（public の image）。digest で取るので、tag が指す先が替わっても同じ物が来る。
          docker run -d --name=e2e-store -p 127.0.0.1:8801:8080 "ghcr.io/uraitakahito/pagetray@$digest"
          for _ in $(seq 1 40); do curl -fsS http://127.0.0.1:8801/healthz && break; sleep 0.5; done
          # 起きた物の版が、書いた版と同じか。
          curl -fsS http://127.0.0.1:8801/api/version | tee version.json
          grep -q "\"version\":\"${version#v}\"" version.json
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: cli
      - name: roster の命令を本物に向けて流す
        working-directory: cli
        # $ROSTER_E2E_PAGES_URL が無いと、この試験は飛ばされる（ふだんの pnpm test）。ここでは必ず渡す。
        run: ROSTER_E2E_PAGES_URL=http://127.0.0.1:8801 pnpm exec vitest run test/pagetray-e2e.test.ts
      - if: always()
        run: docker logs e2e-store
