# roster のメッセージキュー（NATS JetStream）の設定。container の /etc/nats に読むだけで付ける（起こし方は docs-site の運用のページ）。
# container の外には、起こす時の -p 127.0.0.1:4222:4222 でだけ出す（LAN に開かない）。
listen: 0.0.0.0:4222

jetstream {
  # 預かった物・取り口の位置・取り置きを残す所（名前つきの volume を付ける）。
  store_dir: "/data"
  # 書くたびに disk に書く。既定（2 分ごとにまとめて書く）だと、電源が切れた時に直前の物を失いうる。
  sync_interval: always
  max_mem: 64M
  max_file: 1G
}
