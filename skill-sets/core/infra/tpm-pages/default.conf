# 代わりの置き場（tpm-pages）の Nginx の設定。container の /etc/nginx/conf.d に読むだけで mount する。
# 起こし方・止め方は docs-site の運用のページ（operations.md の「代わりの置き場（tpm-pages）」）。
# localhost だけに絞るのはここでなく、container の port の publish（-p 127.0.0.1:<port>:80）で行う。
server {
  listen 80;
  root /usr/share/nginx/html;

  # <meta charset> の無い HTML も、文字化けしないように utf-8 と名乗る
  charset utf-8;
  charset_types text/html text/plain text/css application/javascript application/json image/svg+xml;

  # 課題の folder（/<状態の folder の名>/<鍵>/）の一覧を出す。時刻は container の TZ で出す
  autoindex on;
  autoindex_localtime on;

  location / {
    try_files $uri $uri/ =404;
    # 担当が書き換えたページを、次に開いたときにすぐ見せる
    add_header Cache-Control "no-cache";
  }
}
