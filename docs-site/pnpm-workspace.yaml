# docs-site/ は自分の root の pnpm の project。下の設定のために置く。
# 公開から 2 日（2880 分）たっていない version は入れない（cli/ と同じ）。
minimumReleaseAge: 2880

# 上流が古い系列に縛っている依存を、勧告の修正版の系列へ上げる。
# mermaid > katex: mermaid が katex を ^0.16 系で要求する。0.16 系は GHSA-238p-pmpm-9mq7
# （low、修正版は 0.18.2）の対象。
# 外す条件: mermaid が、katex を 0.18.2 以上で要求する版を出したとき。
overrides:
  mermaid>katex: ^0.18.2

# package.json の engines.node（>=26）に合わない Node では install を止める。
# version は repo の一番上の .node-version で決める（nodenv が読む）。
engineStrict: true
